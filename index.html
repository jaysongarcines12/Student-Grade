<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Grade Report</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>BSIT 1 - Web Development Class</h1>

  <table>
    <caption>Student Grade Report</caption>
    <thead>
      <tr>
        <th>Student No.</th>
        <th>Student Name</th>
        <th class="num">HTML</th>
        <th class="num">CSS</th>
        <th class="num">Average</th>
        <th>Remarks</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>001</td>
        <td>Juan Dela Cruz</td>
        <td class="num">90</td>
        <td class="num">88</td>
        <td class="num">89</td>
        <td class="passed">Passed</td>
      </tr>
      <tr>
        <td>002</td>
        <td>Maria Santos</td>
        <td class="num">95</td>
        <td class="num">92</td>
        <td class="num">93.5</td>
        <td class="passed">Passed</td>
      </tr>
      <tr>
        <td>003</td>
        <td>Pedro Reyes</td>
        <td class="num">78</td>
        <td class="num">82</td>
        <td class="num">80</td>
        <td class="passed">Passed</td>
      </tr>
      <tr>
        <td>004</td>
        <td>Ana Garcia</td>
        <td class="num">86</td>
        <td class="num">89</td>
        <td class="num">87.5</td>
        <td class="passed">Passed</td>
      </tr>
      <tr>
        <td>005</td>
        <td>Carlo Mendoza</td>
        <td class="num">72</td>
        <td class="num">74</td>
        <td class="num">73</td>
        <td class="failed">Failed</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="2">Class Average</td>
        <td class="num">84.2</td>
        <td class="num">85</td>
        <td class="num">84.6</td>
        <td></td>
      </tr>
    </tfoot>
  </table>

</body>
</html>
